name: CampusFix CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./src/CampusFix/CampusFix.sln

      - name: Build solution
        run: dotnet build ./src/CampusFix/CampusFix.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./src/CampusFix/CampusFix.sln --configuration Release --no-build --verbosity normal

      - name: Publish web application
        if: github.ref == 'refs/heads/main'
        run: dotnet publish ./src/CampusFix/CampusFix.Web/CampusFix.Web.csproj --configuration Release --output ./publish

      - name: Upload release artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: CampusFix-Web-Release
          path: ./publish